name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Bunker · typecheck + test（workerd 真实运行时）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter bunker typecheck

      - name: Test
        run: pnpm --filter bunker test

      - name: Deploy dry-run（校验 wrangler 配置与打包体积）
        run: pnpm --filter bunker exec wrangler deploy --dry-run

  app:
    name: App · flutter analyze + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK（编译验证）
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: signpost-apk
          path: packages/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'SIGNPOST Mobile App (Latest Build)' }}
          body: |
            ## SIGNPOST 移动审批终端 (Android APK)

            自托管 NIP-46 Remote Signer (Bunker) 的配套移动审批 App。

            ### 安装与使用说明
            1. 下载下方附件中的 `app-release.apk` 安装到 Android 手机。
            2. 打开网页控制台 [SIGNPOST 控制台](https://nostr-signer-bunker.jeanpaul20020519.workers.dev)。
            3. 点击 **【复制配对串】** 粘贴至 App 中即可一键完成接入。
          files: packages/app/build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
