name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Bunker · typecheck + test（workerd 真实运行时）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter bunker typecheck

      - name: Test
        run: pnpm --filter bunker test

      - name: Deploy dry-run（校验 wrangler 配置与打包体积）
        run: pnpm --filter bunker exec wrangler deploy --dry-run

  app:
    name: App · flutter analyze + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK（编译验证）
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: signpost-apk
          path: packages/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
